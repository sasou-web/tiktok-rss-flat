name: Flat

# Regenere les flux RSS TikTok et les commit.
#
# Important : ce job doit ECHOUER (rouge) quand la recuperation echoue.
# L'ancienne version faisait un `git commit --allow-empty` systematique, donc
# l'Action restait verte alors que plus aucune video n'etait recuperee depuis
# des semaines. Ici, `postprocessing.py` sort en code 1 si un compte ne renvoie
# aucune video, et on ne commit que s'il y a vraiment des changements.

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "10 */4 * * *"

permissions:
  contents: write

concurrency:
  group: tiktok-rss
  cancel-in-progress: false

jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Pas de cache pip : on veut la derniere version de yt-dlp a chaque run,
        # c'est ce qui permet au scraping de se reparer tout seul.
        run: pip install --upgrade -r requirements.txt

      - name: Generate RSS feeds
        run: python postprocessing.py

      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add rss thumbnails
          if git diff --cached --quiet; then
            echo "Aucun changement : pas de nouvelle video depuis le dernier run."
            exit 0
          fi
          git commit -m "Latest TikTok RSS"
          git pull --rebase --autostash origin main
          git push
